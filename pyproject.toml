[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dbvora"
version = "0.2.0"
description = "Local-first read-only database inventory and structure map"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]
# PostgreSQL driver is OFF by default; install only for owner-authorized TLS scans.
postgres = ["psycopg[binary]>=3.2,<4"]
# TestClient uses httpx; keep dev-only dependency out of customer core install.
test = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["dbvora*"]

[tool.setuptools.package-data]
"dbvora" = ["web/*.html", "web/*.js", "web/*.css"]
